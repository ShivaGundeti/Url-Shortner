name: CI Testing Robot

# 1. When should this robot wake up?
on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Python Unit Tests
    runs-on: ubuntu-latest

    steps:
      # 2. Download our code from GitHub onto the Ubuntu computer
      - name: Checkout Code
        uses: actions/checkout@v3

      # 3. Install Python on the Ubuntu computer
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 4. Install our dependencies
      - name: Install Dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest httpx
           prisma generate

      # 5. Run the actual test!
      - name: Run PyTest
        run: |
          cd backend
          pytest test_main.py
